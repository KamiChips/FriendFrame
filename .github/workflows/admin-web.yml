name: Admin web

on:
  pull_request:
    branches: [main]
    paths: ["admin-web/**", ".github/workflows/admin-web.yml"]
  push:
    branches: [main]
    paths: ["admin-web/**", ".github/workflows/admin-web.yml"]

defaults:
  run:
    working-directory: admin-web

permissions:
  contents: read

jobs:
  check:
    name: Lint, tipos, pruebas y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: admin-web-dist
          path: admin-web/dist
          retention-days: 7

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin-web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: admin-web/playwright-report
          retention-days: 7
